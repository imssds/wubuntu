name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Version tests
        run: ./source/test-version.ps1
      - name: Validate release version
        id: version
        run: |
          $version = ./source/get-version.ps1 -Tag $env:GITHUB_REF_NAME
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build and package
        run: ./source/package.ps1 -ScratchDirectory "$env:RUNNER_TEMP/Wubuntu-tests"
      - name: Test
        run: ./source/test.ps1 -ScratchDirectory "$env:RUNNER_TEMP/Wubuntu-tests" -Group all
      - uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: dist/Wubuntu-${{ steps.version.outputs.version }}-win-x64.zip
          if-no-files-found: error
      - name: Failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-diagnostics
          path: ${{ runner.temp }}/Wubuntu-tests/*.log
          if-no-files-found: ignore

  draft:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-zip
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" "dist/Wubuntu-$RELEASE_VERSION-win-x64.zip" \
            --verify-tag --draft --title "Wubuntu $RELEASE_VERSION" --generate-notes
